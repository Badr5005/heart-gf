<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Typographic Heart</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#00f2fe;color-scheme:dark}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;user-select:none;font-family:'Inter',system-ui,sans-serif}
.serif{font-family:'Cinzel',serif}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.3) 2px,rgba(0,0,0,.3) 4px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.6) 100%)}
.theme-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);transition:.2s}
.theme-btn:hover{background:rgba(255,255,255,.1)}
.theme-btn.active{border-color:var(--c);color:var(--c);background:rgba(255,255,255,.06);box-shadow:0 0 14px -4px var(--c)}
input[type=range]{accent-color:var(--c)}
#drawer{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1.5rem);padding-top:calc(env(safe-area-inset-top,0px) + 1.5rem);visibility:hidden;transition:transform .5s ease-in-out,visibility 0s linear .5s}
#drawer.open{visibility:visible;transition:transform .5s ease-in-out,visibility 0s}
</style>
</head>
<body class="h-full w-full relative overflow-hidden bg-black">

<canvas id="cv" class="absolute inset-0 w-full h-full block cursor-crosshair z-0" style="touch-action:none"></canvas>
<div class="absolute inset-0 scan pointer-events-none z-10"></div>

<div class="absolute right-5 z-20 flex items-center gap-3" style="bottom:calc(env(safe-area-inset-bottom,0px) + 1.25rem)">
  <button id="qReplay" title="Replay" class="p-3 rounded-full bg-black/60 hover:bg-white/15 backdrop-blur-md border border-white/15 transition hover:scale-105 active:scale-95 group">
    <svg class="w-5 h-5 group-hover:rotate-180 transition-transform duration-700" style="color:var(--c)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
  </button>
  <button id="tog" class="px-4 py-3 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 flex items-center gap-2 transition hover:scale-105 active:scale-95">
    <svg class="w-5 h-5" style="color:var(--c)" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <span class="text-xs font-medium tracking-wide">Customize</span>
  </button>
</div>

<aside id="drawer" class="absolute top-0 right-0 h-full w-80 max-w-[88vw] bg-black/70 backdrop-blur-md border-l border-white/10 z-30 px-6 flex flex-col justify-between translate-x-full overflow-y-auto">
  <div>
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10">
      <h2 class="serif text-lg font-bold tracking-wide">Heart Settings</h2>
      <button id="close" class="text-white/60 hover:text-white p-1 rounded-lg hover:bg-white/10" aria-label="Close">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <label class="block text-[11px] uppercase tracking-[.18em] text-white/55 mb-2">Hero center message</label>
    <input id="msg" maxlength="20" value="Love You" class="w-full px-4 py-2.5 mb-6 rounded-xl bg-white/5 border border-white/15 text-sm focus:outline-none" style="caret-color:var(--c)" onfocus="this.style.borderColor='var(--c)'" onblur="this.style.borderColor=''">
    <div class="flex justify-between items-center mb-2">
      <label class="text-[11px] uppercase tracking-[.18em] text-white/55">Animation speed</label>
      <span id="spv" class="text-xs font-semibold" style="color:var(--c)">1.0x</span>
    </div>
    <input id="speed" type="range" min="0.4" max="2.5" step="0.1" value="1" class="w-full mb-6 cursor-pointer">
    <label class="block text-[11px] uppercase tracking-[.18em] text-white/55 mb-3">Neon theme</label>
    <div id="themes" class="grid grid-cols-2 gap-2.5"></div>
  </div>
  <div class="space-y-3 pt-6 mt-6 border-t border-white/10">
    <button id="replay" class="w-full py-3 rounded-xl text-black font-semibold text-xs tracking-[.18em] uppercase transition hover:brightness-110" style="background:var(--c);box-shadow:0 0 22px -6px var(--c)">Replay animation</button>
    <button id="full" class="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 text-xs tracking-[.18em] uppercase transition">Toggle fullscreen</button>
  </div>
</aside>

<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
const SANS="'Inter',system-ui,sans-serif",SERIF="Georgia,'Times New Roman',serif";
const CFG={
  outline:{crisp:.78,mid:.9,shade:1.08},
  fill:{crisp:.78,mid:.9,shade:1.08},
  hero:{crisp:1,mid:1.03,shade:1.4}
};
const WEIGHT={crisp:600,mid:500,shade:600},ALPHA={shade:.62,mid:.4,crisp:1},BLUR={shade:3,mid:14,crisp:8},PAR={shade:1.1,mid:.55,crisp:0};
const LI={shade:0,mid:1,crisp:2};
const T_OUT=5,T_FILL0=5.4,T_FILL=3.6,T_HERO=9.6,T_END=15;
const st={theme:'bpurple',speed:1,hero:'Love You'};
let W,H,D,S,CX,CY,HY,G=[],T=0,clock=0,sparks=[],waves=[],burst=false,NO=88;
let dirty=true,gen=0,spc=new Map(),HC={},work=0,wn=0,hfs=1,hw=1;
const P={x:0,y:0,vx:0,vy:0,a:false,t:0},par={x:0,y:0};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=x=>1-Math.pow(1-x,3);
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixc=(a,b,t)=>{const A=rgb(a),B=rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const stopAt=(arr,u)=>{const x=u*(arr.length-1),i=Math.min(arr.length-2,Math.floor(x));return mixc(arr[i],arr[i+1],x-i)};
const THEMES={},DK=['#1d1a26','#0b0a10','#000000'];
function addTheme(k,n,stops,o={}){
  const mid=stops[(stops.length-1)>>1],dark=o.dark!==undefined?o.dark:!!o.bg;
  THEMES[k]={n,dark,stops:dark?DK:stops,sw:stops,c:dark?'#000000':mid,f:dark?'#ffffff':mixc(mid,'#ffffff',.55),
    bg:o.bg||['#000000','#000000'],a:dark?mixc(o.bg[0],'#ffffff',.4):mid,hero:o.hero||'#ffffff'};
}
[['cyan','Electric Cyan',['#4cc8ff','#339aff','#2a6cf2','#2a52dc']],
 ['aurora','Aurora',['#5dffc0','#27e0e8','#5a8cff','#a35cff']],
 ['rose','Crimson Rose',['#ff7aa0','#ff3366','#d02a78']],
 ['sunset','Sunset',['#ffd166','#ff8a4c','#ff4d7a','#c23cd1']],
 ['violet','Neon Violet',['#d6a8ff','#a05cff','#6a4cff']],
 ['green','Matrix Green',['#9dffb8','#00ff66','#00cfa6']],
 ['gold','Solar Gold',['#fff0a0','#ffc933','#ff9d1c','#ff6a1f']],
 ['candy','Cotton Candy',['#7ff0ff','#c9a7ff','#ff9be0','#ff7aa8']],
 ['ice','Ice',['#ffffff','#bfe9ff','#7ac7ff','#4f9bff']]
].forEach(a=>addTheme(...a));
addTheme('pkneon','Pink on Black',['#ffc4e3','#ff6bb5','#ff2d95','#d4107a'],{dark:false,bg:['#3a0b26','#07030a'],hero:'#fff5fa'});
[['bpurple','Purple',['#7b2cf0','#3d0f8a']],
 ['bcrimson','Crimson',['#ff3a5c','#7a0a24']],
 ['bocean','Ocean',['#3fd0ff','#0b4fc4']],
 ['bpink','Hot Pink',['#ff7ad9','#c4129b']],
 ['bsunset','Sunset',['#ffcf5c','#ff3d77']],
 ['bgold','Gold',['#ffd23f','#e8890c']],
 ['bmint','Mint',['#8dffd6','#12b886']],
 ['bwhite','White',['#ffffff','#cfd3da'],'#111111']
].forEach(([k,n,bg,hero])=>addTheme(k,n,DK,{bg,hero}));
let PAL={crisp:[],mid:[],shade:[]};
function buildPal(){
  const T0=THEMES[st.theme];PAL={crisp:[],mid:[],shade:[]};
  for(let i=0;i<24;i++){const c=stopAt(T0.stops,i/23);PAL.crisp.push(T0.dark?c:mixc(c,'#ffffff',.28));PAL.mid.push(c);PAL.shade.push(mixc(c,'#000000',.38))}
}
const hh=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};

const CURVE=(()=>{
  const N=3000,a=[],c=[];let L=0;
  for(let i=0;i<=N;i++){
    const t=i/N*Math.PI*2,x=16*Math.sin(t)**3,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    if(i)L+=Math.hypot(x-a[i-1][0],y-a[i-1][1]);
    a.push([x,y]);c.push(L);
  }
  return{a,c,L};
})();
function sample(n){
  const o=new Array(n);let j=0;
  for(let k=0;k<n/2;k++){
    const tg=(k+.5)/n*CURVE.L;while(CURVE.c[j]<tg)j++;
    const p=CURVE.a[j];o[k]=[p[0],p[1]];o[n-1-k]=[-p[0],p[1]];
  }
  return o;
}
function inside(o,x,y){
  let r=false;
  for(let i=0,j=o.length-1;i<o.length;j=i++){
    const[xi,yi]=o[i],[xj,yj]=o[j];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)r=!r;
  }
  return r;
}
function build(){
  G=[];
  const V=['Love You','love you','LOVE YOU'],N=88,O=sample(N);NO=N;
  for(let i=0;i<N;i++){
    const [x,y]=O[i],len=Math.hypot(x,y-2.5)||1,off=(hh(i*3+5)-.62)*1.5;
    const hx=CX+(x+x/len*off)*S,hy=CY+(y+(y-2.5)/len*off)*S;
    G.push({k:'o',t:V[(i*7+Math.floor(hh(i+3)*3))%3],hx,hy,x:hx,y:hy,vx:0,vy:0,m:1,s:.85+hh(i+11)*.4,at:i/N*T_OUT});
  }
  const F=[],poly=sample(200),K=.98;
  const h=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
  let id=0;
  for(let r=0,y=-11;y<=17;y+=1.5,r++){
    const ro=hh(r+7)*5.6;
    for(let x=-17+ro;x<=17;x+=5.6){
      id++;
      if(hh(id+222)<.3)continue;
      const jx=x+(hh(id)-.5)*2.2,jy=y+(hh(id+500)-.5)*.5;
      if(!inside(poly,jx/K,(jy-2.5)/K+2.5))continue;
      F.push({d:Math.hypot(jx,jy-1.2)+h(id+77)*4,x:jx,y:jy,t:V[Math.floor(h(id+900)*3)],s:.78+h(id+1300)*.5});
    }
  }
  F.sort((a,b)=>b.d-a.d);
  F.forEach((p,i)=>{
    const hx=CX+p.x*S,hy=CY+p.y*S;
    G.push({k:'f',t:p.t,s:p.s,hx,hy,x:hx,y:hy,vx:0,vy:0,m:1,at:T_FILL0+i/F.length*T_FILL});
  });
  G.forEach((g,i)=>{g.u=clamp(.15+.3*(g.hy-(CY-12*S))/(29*S)+.15*(g.hx-(CX-16*S))/(32*S)+(hh(i+31)-.5)*.5)});
}
function setRes(){cv.width=Math.round(W*D);cv.height=Math.round(H*D);gen++;spc.clear();HC={};dirty=true}
function resize(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  setRes();
  S=Math.min(W/28,H/32);CX=W/2;CY=H/2-2.5*S;HY=CY+1.2*S;
  build();
}
function replay(){
  T=0;burst=false;sparks=[];waves=[];dirty=true;
  for(const g of G){g.x=g.hx;g.y=g.hy;g.vx=g.vy=0}
}
function spark(x,y,n,spd){
  const th=THEMES[st.theme];
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=spd*(.25+Math.random());
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.7,c:i%2?th.c:th.f});
  }
}
function wave(x,y){waves.push({x,y,r:0,max:Math.max(W,H)*.6,a:.7})}

/* ---- sprite caches: glow is rendered once, then just blitted ---- */
function mk(L,t,px,col){
  const b=BLUR[L]*D,f=px*D,c=document.createElement('canvas'),x=c.getContext('2d'),fnt=`${WEIGHT[L]} ${f}px ${SANS}`;
  x.font=fnt;
  const p=Math.ceil(b*2+4),w=Math.ceil(x.measureText(t).width)+2*p,h=Math.ceil(f*1.5)+2*p;
  c.width=w;c.height=h;
  x.font=fnt;x.textAlign='center';x.textBaseline='middle';
  x.globalAlpha=ALPHA[L];x.fillStyle=col;x.shadowColor=col;x.shadowBlur=b;
  x.fillText(t,w/2,h/2);
  return{c,a:w/2,b:h/2};
}
function heroSprite(L,th,msg,f){
  const key=msg+'|'+f.toFixed(2)+'|'+th.c+'|'+th.hero+'|'+D;
  let h=HC[L];
  if(h&&h.key===key)return h;
  const sh=L==='shade',b=(sh?7:L==='mid'?22:8)*D,fs=f*D,c=document.createElement('canvas'),x=c.getContext('2d'),fnt=`700 ${fs}px ${SERIF}`;
  x.font=fnt;
  const p=Math.ceil(b*2+4),w=Math.ceil(x.measureText(msg).width)+2*p,hh2=Math.ceil(fs*1.5)+2*p;
  c.width=w;c.height=hh2;
  x.font=fnt;x.textAlign='center';x.textBaseline='middle';
  x.globalAlpha=sh?.72:L==='mid'?.3:1;
  x.shadowColor=sh?'#8f959c':th.c;x.shadowBlur=b;x.fillStyle=sh?'#a5a9ae':th.hero;
  x.fillText(msg,w/2,hh2/2);
  return HC[L]={key,c,a:w/2,b:hh2/2};
}
function spk(col,r){
  const rq=Math.round(r*5),key=col+rq;
  let s=spc.get(key);
  if(s)return s;
  const b=8*D,rr=rq/5*D,pad=Math.ceil(b*2+rr+2),c=document.createElement('canvas');
  c.width=c.height=pad*2;
  const x=c.getContext('2d');
  x.globalCompositeOperation='lighter';
  x.fillStyle=col;x.shadowColor=col;x.shadowBlur=b;
  x.beginPath();x.arc(pad,pad,rr,0,6.283);x.fill();
  s={c,a:pad};spc.set(key,s);
  return s;
}

function step(dt){
  clock+=dt;T+=dt*st.speed;
  const tx=P.a?(P.x-CX)/W:0,ty=P.a?(P.y-H/2)/H:0;
  par.x+=(tx-par.x)*Math.min(1,dt*4);
  par.y+=(ty-par.y)*Math.min(1,dt*4);
  let act=T<T_END||sparks.length>0||waves.length>0||Math.abs(tx-par.x)>1e-3||Math.abs(ty-par.y)>1e-3;
  const dec=Math.exp(-dt*8);P.vx*=dec;P.vy*=dec;
  const R=6*S;
  for(const g of G){
    if(T<g.at)continue;
    let ax=(g.hx-g.x)*45-g.vx*7,ay=(g.hy-g.y)*45-g.vy*7;g.m=1;
    if(P.a){
      const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy);
      if(d<R){const f=1-d/R;ax+=dx*f*9;ay+=dy*f*9;g.vx+=P.vx*f*dt*2;g.vy+=P.vy*f*dt*2;g.m=1+f*1.6}
    }
    g.vx+=ax*dt;g.vy+=ay*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;
    if(!act&&(Math.abs(g.vx)+Math.abs(g.vy)>.05||Math.abs(ax)+Math.abs(ay)>.3))act=true;
  }
  let j=0;
  for(const s of sparks){s.l-=dt;if(s.l<=0)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.97;s.vy*=.97;sparks[j++]=s}
  sparks.length=j;
  for(const w of waves){w.r+=dt*S*16;w.a*=Math.pow(.25,dt)}
  waves=waves.filter(w=>w.r<w.max&&w.a>.02);
  if(T>0&&T<T_OUT+.2){
    const g=G[Math.min(NO-1,Math.floor(T/T_OUT*NO))];
    spark(g.x,g.y,2,S*5);
  }
  return act;
}

function layer(L){
  const li=LI[L],pal=PAL[L],dx=par.x*S*PAR[L],dy=par.y*S*PAR[L],bl=BLUR[L]*D,wt=WEIGHT[L],al=ALPHA[L];
  ctx.setTransform(1,0,0,1,0,0);ctx.shadowBlur=0;ctx.globalAlpha=1;
  for(const g of G){
    if(T<g.at)continue;
    const a=Math.min(1,(T-g.at)/.4),px=CFG[g.k==='f'?'fill':'outline'][L]*S*(g.s||1),col=pal[Math.round(g.u*23)];
    if(a>=1&&g.m===1){
      if(g.gen!==gen){g.sp=[0,0,0];g.gen=gen}
      let s=g.sp[li];if(!s)s=g.sp[li]=mk(L,g.t,px,col);
      ctx.drawImage(s.c,Math.round((g.x+dx)*D-s.a),Math.round((g.y+dy)*D-s.b));
    }else{
      const pop=1+(1-a)*.6;
      ctx.globalAlpha=al*a;ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=bl;
      ctx.font=`${wt} ${px*g.m*pop}px ${SANS}`;
      ctx.setTransform(D,0,0,D,D*(g.x+dx),D*(g.y+dy));
      ctx.fillText(g.t,0,0);
      ctx.setTransform(1,0,0,1,0,0);ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
  ctx.setTransform(D,0,0,D,0,0);ctx.globalAlpha=1;
}
function hero(L,th){
  const p=L==='shade'?clamp((T-T_HERO)/3.4):clamp((T-T_HERO-2.4)/2.8);
  if(p<=0)return;
  const msg=st.hero||' ',f=Math.min(hfs*CFG.hero[L],.9*W*100/hw),h=heroSprite(L,th,msg,f);
  ctx.setTransform(1,0,0,1,0,0);ctx.shadowBlur=0;ctx.globalAlpha=p;
  ctx.drawImage(h.c,Math.round((CX+par.x*S*PAR[L])*D-h.a),Math.round((HY+par.y*S*PAR[L])*D-h.b));
  ctx.globalAlpha=1;ctx.setTransform(D,0,0,D,0,0);
}
function drawWaves(th){
  const[r,g,b]=rgb(th.c),sg=5,z=`rgba(${r},${g},${b},0)`;
  ctx.lineWidth=1.5;ctx.strokeStyle=th.c;ctx.shadowBlur=0;
  for(const w of waves){
    const r0=Math.max(0,w.r-3*sg),r1=w.r+3*sg,gr=ctx.createRadialGradient(w.x,w.y,r0,w.x,w.y,r1);
    gr.addColorStop(0,z);
    for(let d=-2.5;d<=2.5;d+=.5){const pos=w.r+d*sg;if(pos<=r0)continue;gr.addColorStop((pos-r0)/(r1-r0),`rgba(${r},${g},${b},${(.1197*Math.exp(-d*d/2)).toFixed(4)})`)}
    gr.addColorStop(1,z);
    ctx.globalAlpha=w.a*.6;ctx.fillStyle=gr;
    ctx.beginPath();ctx.arc(w.x,w.y,r1,0,6.283);ctx.arc(w.x,w.y,r0,0,6.283,true);ctx.fill();
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.283);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(D,0,0,D,0,0);ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;ctx.globalAlpha=1;
  const bg=THEMES[st.theme].bg;
  if(bg[0]===bg[1])ctx.fillStyle=bg[0];else{const g=ctx.createRadialGradient(CX,H/2,0,CX,H/2,Math.max(W,H)*.7);g.addColorStop(0,bg[0]);g.addColorStop(1,bg[1]);ctx.fillStyle=g}
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const th=THEMES[st.theme];
  ctx.font=`700 100px ${SERIF}`;
  hw=ctx.measureText(st.hero||' ').width||1;hfs=Math.min(12.6*S*100/hw,3.4*S);
  hero('shade',th);
  if(waves.length)drawWaves(th);
  layer('shade');layer('mid');layer('crisp');
  hero('mid',th);hero('crisp',th);
  if(sparks.length){
    ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.shadowBlur=0;
    for(const s of sparks){
      const sp=spk(s.c,1+s.l*1.6);
      ctx.globalAlpha=clamp(s.l*1.6);
      ctx.drawImage(sp.c,Math.round(s.x*D-sp.a),Math.round(s.y*D-sp.a));
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.setTransform(D,0,0,D,0,0);
  }
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  if(now-last<9.5)return; /* cap at ~60fps on 90/120Hz screens */
  const dt=Math.min(.033,(now-last)/1000);last=now;
  const t0=performance.now(),act=step(dt);
  if(act||dirty){
    draw();dirty=false;
    work+=performance.now()-t0;
    if(++wn>=40){ /* still CPU-bound on a weak device: drop render resolution a notch */
      if(work/wn>14&&D>1){D=Math.max(1,D-.25)}
      work=0;wn=0;
      if(cv.width!==Math.round(W*D))setRes();
    }
  }
}

function setTheme(k){
  st.theme=k;buildPal();gen++;spc.clear();dirty=true;
  const T0=THEMES[k];document.documentElement.style.setProperty('--c',T0.a||T0.c);document.documentElement.style.background=document.body.style.background=T0.bg[1];
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
}
let grp='';
for(const k in THEMES){
  const T0=THEMES[k],g=T0.dark?'Black Heart':'Neon';
  if(g!==grp){grp=g;const l=document.createElement('div');l.className='col-span-2 text-[10px] uppercase tracking-[.2em] text-white/40 mt-2';l.textContent=g;$('themes').appendChild(l)}
  const b=document.createElement('button');
  b.className='theme-btn px-2.5 py-2 rounded-xl text-[11px] font-medium leading-tight flex items-center gap-2 text-left';
  b.dataset.k=k;
  const sw=T0.dark?`linear-gradient(135deg,${T0.bg[0]},${T0.bg[1]})`:`linear-gradient(135deg,${T0.sw.join(',')})`;
  b.innerHTML=`<span class="shrink-0 w-4 h-4 rounded-full flex items-center justify-center text-[9px] leading-none" style="background:${sw};color:#000;box-shadow:0 0 8px ${T0.a}">${T0.dark?'♥':''}</span><span>${T0.n}</span>`;
  b.onclick=()=>setTheme(k);$('themes').appendChild(b);
}
const dr=$('drawer');let open=false;
function setOpen(v){open=v;dr.classList.toggle('open',v);dr.classList.toggle('translate-x-0',v);dr.classList.toggle('translate-x-full',!v)}
$('tog').onclick=e=>{e.stopPropagation();setOpen(!open)};
$('close').onclick=()=>setOpen(false);
document.addEventListener('pointerdown',e=>{if(open&&!dr.contains(e.target)&&!$('tog').contains(e.target))setOpen(false)});
$('msg').oninput=e=>{st.hero=e.target.value;dirty=true};
$('speed').oninput=e=>{st.speed=+e.target.value;$('spv').textContent=st.speed.toFixed(1)+'x'};
$('replay').onclick=replay;$('qReplay').onclick=replay;
$('full').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

cv.addEventListener('pointermove',e=>{
  const now=performance.now(),dt=Math.max(8,now-P.t);
  if(!P.a){P.vx=P.vy=0}else{
    P.vx+=(clamp((e.clientX-P.x)/dt*1000,-2500,2500)-P.vx)*.5;
    P.vy+=(clamp((e.clientY-P.y)/dt*1000,-2500,2500)-P.vy)*.5;
  }
  P.x=e.clientX;P.y=e.clientY;P.t=now;P.a=true;
  if(Math.random()<.25)spark(P.x,P.y,1,S*4);
});
cv.addEventListener('pointerdown',e=>{P.x=e.clientX;P.y=e.clientY;P.a=true;P.t=performance.now();wave(P.x,P.y);spark(P.x,P.y,10,S*8)});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')P.a=false});
cv.addEventListener('pointerleave',()=>P.a=false);
addEventListener('resize',resize);

setTheme('bpurple');
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{resize();last=performance.now();requestAnimationFrame(loop)});
})();
</script>
